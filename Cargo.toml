[package]
name = "blissdc"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Decompiler for PDP-11 code produced by DEC's BLISS-16 compiler"
repository = "https://src.astrius.ink/blissdc"

[lib]
path = "src/lib.rs"

[[bin]]
name = "blissdc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }

[profile.release]
opt-level = 2
debug = false
